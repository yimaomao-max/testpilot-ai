<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 360px; margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #1e293b; }
      header h1 { font-size: 14px; margin: 0; flex: 1; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
      .dot.on { background: #34d399; animation: blink 1s infinite; }
      @keyframes blink { 50% { opacity: .3; } }
      main { padding: 10px 14px 14px; display: grid; gap: 8px; }
      .modes { display: flex; gap: 6px; }
      .modes button { flex: 1; }
      input[type=text], select { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; padding: 5px 8px; font-size: 12px; }
      label { font-size: 11px; color: #94a3b8; }
      .row { display: flex; gap: 6px; }
      button { border: 0; border-radius: 6px; padding: 6px 8px; font-weight: 600; cursor: pointer; font-size: 12px; }
      #start { background: #0ea5e9; color: #081018; }
      #stop { background: #f43f5e; color: white; }
      #save { background: #22c55e; color: #081018; }
      #verify, #export, #clear { background: #334155; color: #cbd5e1; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      .mode-btn.active { outline: 2px solid #0ea5e9; }
      #steps { max-height: 200px; overflow: auto; background: #0b1222; border: 1px solid #1e293b; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
      .step { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px dashed #1e293b; }
      .step:last-child { border-bottom: 0; }
      .step .txt { flex: 1; min-width: 0; }
      .step .txt .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .step .txt code { color: #7dd3fc; font-size: 10px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .step .assert { color: #fbbf24; font-weight: 700; font-size: 10px; }
      .step button { padding: 1px 5px; background: transparent; color: #64748b; font-size: 11px; }
      .step button:hover { color: #e2e8f0; }
      #msg { font-size: 12px; min-height: 15px; color: #94a3b8; word-break: break-all; }
      #msg.err { color: #fb7185; } #msg.ok { color: #4ade80; }
      a { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <h1>TestPilot 录制器</h1>
      <span id="verdict" style="font-size:11px;color:#64748b"></span>
    </header>
    <main>
      <div class="modes">
        <button id="modeAction" class="mode-btn active">▶ 操作录制</button>
        <button id="modeAssert" class="mode-btn">🔍 断言录制</button>
      </div>
      <input id="name" type="text" placeholder="用例名称（默认取页面标题）" />
      <div class="row">
        <div style="flex:1">
          <label>项目（可选）</label>
          <select id="project"><option value="">不关联</option></select>
        </div>
        <div style="flex:1">
          <label>需求（可选）</label>
          <select id="requirement"><option value="">不关联</option></select>
        </div>
      </div>
      <div id="steps"><div class="step" style="color:#475569">尚无录制步骤</div></div>
      <div class="row">
        <button id="start">● 开始录制</button>
        <button id="stop" disabled>■ 停止</button>
      </div>
      <div class="row">
        <button id="save" disabled>↑ 保存到 TestPilot</button>
        <button id="verify">验证选择器</button>
      </div>
      <div class="row">
        <button id="export">导出 JSON</button>
        <button id="clear">清空</button>
      </div>
      <div id="msg"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
